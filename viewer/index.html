<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penumbra Fly-Through</title>
<style>
  :root { --bg:#05040a; --panel:rgba(16,12,28,.86); --text:#e9e4f5; --muted:#9a90b5; --accent:#ffb347; --line:rgba(255,255,255,.12); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; }
  #panel { position:absolute; top:12px; left:12px; width:270px; max-height:calc(100% - 24px); overflow:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); user-select:none; }
  h1 { font-size:15px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:11px; margin-bottom:10px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0; }
  .row input[type=range] { flex:1; }
  label { cursor:pointer; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 0 4px; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  #peaks { list-style:none; margin:0; padding:0; }
  #peaks li { display:flex; justify-content:space-between; padding:4px 6px; border-radius:6px; cursor:pointer; font-variant-numeric:tabular-nums; }
  #peaks li:hover { background:rgba(255,255,255,.08); }
  button { background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { background:rgba(255,255,255,.16); }
  #readout { position:absolute; bottom:12px; left:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px;
             padding:6px 10px; font-variant-numeric:tabular-nums; pointer-events:none; }
  #note { position:absolute; bottom:12px; right:12px; max-width:340px; color:var(--muted); font-size:11px; text-align:right; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  @media (max-width:600px) { #panel { width:calc(100% - 32px); left:16px; max-height:45%; } #note { display:none; } }
</style>
</head>
<body>
<script>
  // Opened straight from disk (file://)? Browsers block loading ../data from there, so nothing would work.
  if (location.protocol === 'file:') {
    const page = location.pathname.split('/').pop() || 'index.html';
    const url = 'http://localhost:8000/viewer/' + page;
    document.addEventListener('DOMContentLoaded', () => {
      const d = document.createElement('div');
      d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,3,11,.94);color:#e8ecff;font:15px/1.5 system-ui,sans-serif;text-align:center';
      d.innerHTML = '<div style="max-width:460px"><div style="font-size:20px;font-weight:650;margin-bottom:8px">Open this page through the local server</div>' +
        'This file was opened straight from disk, and browsers won\'t let it load the map data from there.<br><br>' +
        'In the repo folder, run <code style="background:rgba(255,255,255,.1);padding:2px 6px;border-radius:4px">python3 serve.py</code>, then open<br>' +
        '<a style="color:#6aa8ff" href="' + url + '">' + url + '</a></div>';
      document.body.appendChild(d);
    });
  }
</script>
<div id="loading">Loading layers…</div>
<div id="panel">
  <div class="row" style="margin:0"><h1>Penumbra</h1><button id="collapse" aria-expanded="true">Hide</button></div>
  <div class="sub"><a href="cosmic-web.html" style="color:var(--accent)">Cosmic web simulator →</a></div>
  <div id="panelBody">
  <div class="sub" id="source"></div>

  <h2>Layers (looking deeper →)</h2>
  <div id="layers"></div>
  <div class="row"><span>Spacing</span><input id="spacing" type="range" min="0" max="8" step="0.1" value="3"></div>
  <div class="row"><span>Opacity</span><input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.7"></div>
  <div class="row"><label><input id="showPeaks" type="checkbox" checked> Show peaks</label>
       <button id="reset">Reset view</button></div>

  <h2>Fly to a peak (highest)</h2>
  <ul id="peaks"></ul>
  </div>
</div>
<div id="readout">Hover over a layer to read κ</div>
<div id="note"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const BASE = '../data/';
const BIN_COLORS = [0x7fd8ff, 0x9dff8a, 0xffd34d, 0xff6b9e];

const m = await (await fetch(BASE + 'manifest.json', { cache: 'no-cache' })).json();
// Version tag for images, so a browser never pairs a new manifest with old cached layers.
const VER = encodeURIComponent(m.layers.map(L => L.vmax).join(','));
const { ra_min, ra_max, dec_min, dec_max } = m.bounds;
const [H_PX, W_PX] = m.layers[0].shape;
// Plate carrée: keep the sky's degree aspect ratio.
const W = 24, H = W * (dec_max - dec_min) / (ra_max - ra_min);

document.getElementById('source').textContent =
  `${m.source} · ${m.smoothing_arcmin}′ smoothing · RA ${ra_min}…${ra_max}°, Dec ${dec_min}…${dec_max}°`;
document.getElementById('note').textContent = m.note ||
  'Layers are mass projected toward more distant sources, not slices of space.';

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040a);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const HOME = { pos: new THREE.Vector3(0, -14, 16), target: new THREE.Vector3(0, 0, -4.5) };
camera.position.copy(HOME.pos); controls.target.copy(HOME.target);

// Faint background stars for depth cues.
{
  const n = 1500, pos = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 300;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8a80aa, size: 0.15 })));
}

// ---------- coordinates ----------
const wrapRA = ra => (ra > ra_max ? ra - 360 : ra); // RA 316 means -44 here
function skyToXY(ra, dec) {
  ra = wrapRA(ra);
  return [(ra_max - ra) / (ra_max - ra_min) * W - W / 2,   // column 0 = ra_max (east left)
          (dec - dec_min) / (dec_max - dec_min) * H - H / 2];
}
function xyToSky(x, y) {
  let ra = ra_max - (x + W / 2) / W * (ra_max - ra_min);
  if (ra < 0) ra += 360;
  return [ra, dec_min + (y + H / 2) / H * (dec_max - dec_min)];
}

// ---------- layers ----------
let spacing = 3, opacity = 0.7;
const loader = new THREE.TextureLoader();
const layerGroups = [];
const raw = []; // Float32Array per layer, filled lazily

await Promise.all(m.layers.map((L, i) => new Promise(res => {
  loader.load(`${BASE}${L.png}?v=${VER}`, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity,
                                              depthWrite: false, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat);
    mesh.userData.layer = i;
    const frame = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),
      new THREE.LineBasicMaterial({ color: BIN_COLORS[i], transparent: true, opacity: 0.35 }));
    const group = new THREE.Group();
    group.add(mesh, frame);
    group.userData = { mesh, peaks: new THREE.Group() };
    group.add(group.userData.peaks);
    scene.add(group);
    layerGroups[i] = group;
    res();
  });
})));
document.getElementById('loading').remove();

function layoutLayers() {
  layerGroups.forEach((g, i) => { g.position.z = -i * spacing; });
}
layoutLayers();

// Layer toggles
const layersDiv = document.getElementById('layers');
m.layers.forEach((L, i) => {
  const row = document.createElement('div'); row.className = 'row';
  const hex = '#' + BIN_COLORS[i].toString(16).padStart(6, '0');
  row.innerHTML = `<label><input type="checkbox" checked> <span class="swatch" style="background:${hex}"></span>${L.name}</label>
                   <span style="color:var(--muted)">σ=${L.sigma.toFixed(4)}</span>`;
  row.querySelector('input').onchange = e => { layerGroups[i].visible = e.target.checked; };
  layersDiv.appendChild(row);
});

// ---------- peaks ----------
const peakGeo = new THREE.SphereGeometry(0.07, 16, 16);
const peakMeshes = [];
m.peaks.forEach(p => {
  const [x, y] = skyToXY(p.ra, p.dec);
  const s = new THREE.Mesh(peakGeo, new THREE.MeshBasicMaterial({ color: BIN_COLORS[p.bin] }));
  s.position.set(x, y, 0.06);
  s.scale.setScalar(p.snr / 5);
  s.userData.peak = p;
  layerGroups[p.bin].userData.peaks.add(s);
  peakMeshes.push(s);
});

const peaksUl = document.getElementById('peaks');
[...m.peaks].sort((a, b) => b.snr - a.snr).slice(0, 15).forEach(p => {
  const li = document.createElement('li');
  const hex = '#' + BIN_COLORS[p.bin].toString(16).padStart(6, '0');
  li.innerHTML = `<span><span class="swatch" style="background:${hex}"></span>RA ${p.ra.toFixed(1)}°, Dec ${p.dec.toFixed(1)}°</span><span>${p.snr.toFixed(1)}σ</span>`;
  li.onclick = () => flyToPeak(p);
  peaksUl.appendChild(li);
});

// ---------- camera fly ----------
let flight = null;
function flyTo(pos, target, ms = 1400) {
  flight = { t0: performance.now(), ms,
             p0: camera.position.clone(), p1: pos,
             q0: controls.target.clone(), q1: target };
}
function flyToPeak(p) {
  const [x, y] = skyToXY(p.ra, p.dec);
  const z = -p.bin * spacing;
  if (!layerGroups[p.bin].visible) {
    layerGroups[p.bin].visible = true;
    layersDiv.querySelectorAll('input')[p.bin].checked = true;
  }
  // Stop inside the gap in front of the target layer, so nearer layers don't blur the view.
  const d = p.bin === 0 ? 4.5 : Math.min(4.5, Math.max(1.5, spacing * 0.85));
  flyTo(new THREE.Vector3(x, y - d * 0.5, z + d), new THREE.Vector3(x, y, z));
}
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ---------- controls ----------
document.getElementById('spacing').oninput = e => { spacing = +e.target.value; layoutLayers(); };
document.getElementById('opacity').oninput = e => {
  opacity = +e.target.value;
  layerGroups.forEach(g => { g.userData.mesh.material.opacity = opacity; });
};
document.getElementById('showPeaks').onchange = e => {
  layerGroups.forEach(g => { g.userData.peaks.visible = e.target.checked; });
};
document.getElementById('collapse').onclick = e => {
  const body = document.getElementById('panelBody'), hide = body.style.display !== 'none';
  body.style.display = hide ? 'none' : '';
  e.target.textContent = hide ? 'Show' : 'Hide';
  e.target.setAttribute('aria-expanded', String(!hide));
};
document.getElementById('reset').onclick = () => flyTo(HOME.pos.clone(), HOME.target.clone());

// ---------- hover readout from the raw float16 grids ----------
function halfToFloat(h) {
  const s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
  if (e === 0) return s * Math.pow(2, -14) * (f / 1024);
  if (e === 31) return f ? NaN : s * Infinity;
  return s * Math.pow(2, e - 15) * (1 + f / 1024);
}
async function loadRaw(i) {
  if (raw[i]) return raw[i];
  raw[i] = 'loading';
  const buf = await (await fetch(BASE + m.layers[i].raw, { cache: 'no-cache' })).arrayBuffer();
  const u16 = new Uint16Array(buf), out = new Float32Array(u16.length);
  for (let k = 0; k < u16.length; k++) out[k] = halfToFloat(u16[k]);
  raw[i] = out;
  return out;
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const readout = document.getElementById('readout');
renderer.domElement.addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);

  const visiblePeaks = peakMeshes.filter(s => s.parent.visible && s.parent.parent.visible);
  const ph = raycaster.intersectObjects(visiblePeaks)[0];
  if (ph) {
    const p = ph.object.userData.peak;
    readout.textContent = `Peak · bin ${p.bin} · RA ${p.ra.toFixed(2)}°, Dec ${p.dec.toFixed(2)}° · κ ${p.kappa.toFixed(4)} (${p.snr.toFixed(1)}σ above the map average)${p.post_snr != null ? ` · ${p.post_snr.toFixed(1)}σ confidence across samples` : ''}`;
    return;
  }

  const meshes = layerGroups.filter(g => g.visible).map(g => g.userData.mesh);
  for (const hit of raycaster.intersectObjects(meshes)) {
    const i = hit.object.userData.layer;
    const col = Math.floor(hit.uv.x * W_PX), row = Math.floor((1 - hit.uv.y) * H_PX);
    const grid = raw[i];
    if (!grid || grid === 'loading') { loadRaw(i); readout.textContent = `Loading ${m.layers[i].name} values…`; return; }
    const v = grid[row * W_PX + col];
    if (Number.isNaN(v)) continue; // outside the survey: look through to the next layer
    const [ra, dec] = xyToSky(hit.point.x, hit.point.y);
    readout.textContent = `${m.layers[i].name} · RA ${ra.toFixed(2)}°, Dec ${dec.toFixed(2)}° · κ ${v.toFixed(4)} (${(v / m.layers[i].sigma).toFixed(1)}σ)`;
    return;
  }
  readout.textContent = 'Outside survey footprint';
});

// ---------- loop ----------
const tmpV = new THREE.Vector3();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(now => {
  if (flight) {
    const t = Math.min(1, (now - flight.t0) / flight.ms), k = ease(t);
    camera.position.lerpVectors(flight.p0, flight.p1, k);
    controls.target.lerpVectors(flight.q0, flight.q1, k);
    if (t === 1) flight = null;
  }
  controls.update();
  // Keep peak markers a steady on-screen size instead of ballooning up close.
  for (const s of peakMeshes) {
    const d = camera.position.distanceTo(s.getWorldPosition(tmpV));
    s.scale.setScalar(s.userData.peak.snr / 5 * Math.min(1, Math.max(0.12, d * 0.05)));
  }
  renderer.render(scene, camera);
});

window.__viewer = { manifest: m, layerGroups, flyToPeak, camera, controls }; // for debugging
</script>
</body>
</html>
